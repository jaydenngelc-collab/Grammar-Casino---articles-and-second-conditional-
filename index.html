<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Casino · Team Edition</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f4e9;background:#111a25}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#25445b,#111a25 65%)}main{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:1.4rem;font-weight:900;letter-spacing:.03em}.gold{color:#f7c95c}.muted{color:#b7c5d2}.panel{background:#1c2c3c;border:1px solid #3c5366;border-radius:20px;padding:24px;margin:20px 0;box-shadow:0 10px 30px #0002}.center{text-align:center}.hero{font-size:clamp(1.6rem,4vw,3rem);line-height:1.25;font-weight:800;margin:24px 0}.small{font-size:.9rem}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.team{border:1px solid #486073;border-radius:14px;padding:15px;background:#24394b}.team b{font-size:1.2rem}button,input,select{font:inherit;border-radius:12px;padding:13px 17px}input,select{background:#101e2b;border:1px solid #607487;color:white;max-width:100%;width:100%}button{border:0;background:#f7c95c;color:#18222c;font-weight:800;cursor:pointer}button:hover{filter:brightness(1.08)}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#31495e;color:white}.danger{background:#e57b70}.choice{flex:1;min-width:140px;padding:20px}.choice.active{outline:3px solid white}.bet{min-width:66px;flex:1}.bet.active{background:#f7c95c;color:#18222c;outline:2px solid white}.big{font-size:2.4rem;font-weight:900}.pin{font-size:3rem;letter-spacing:.2em;font-weight:900}.timer{font-size:3.5rem;font-weight:900;color:#f7c95c}.status{color:#96dfbd}.error{color:#ff9b93}.qr{background:white;padding:12px;border-radius:16px;width:220px;max-width:100%}.hide{display:none!important}.pill{border:1px solid #718293;border-radius:99px;padding:5px 12px;font-size:.85rem}.answer{border-left:5px solid #96dfbd;padding:16px;background:#294d46;border-radius:8px}.result{font-weight:800;font-size:1.5rem}.footer{font-size:.8rem;color:#9fb1c2;margin:22px 0}.full{width:100%}@media(min-width:900px){.teacherLayout{display:grid;grid-template-columns:1fr 260px;gap:20px}.teacherLayout>.panel{margin:0}}@media(max-width:600px){.panel{padding:18px}.pin{font-size:2rem}.hero{font-size:1.6rem}}
</style></head><body><main><header class="top"><div class="brand">🎰 <span class="gold">GRAMMAR</span> CASINO</div><span class="pill">TEAM EDITION</span></header><div id="app"></div><div class="footer">14 rounds · Articles + Second Conditional · 7 correct / 7 incorrect</div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();const app=document.getElementById('app');const qs=new URLSearchParams(location.search);let role=null,code=null,token=null,teamId=null,teamName=null,state=null,choice=null,bet=null,locked=false,clock=null,notice='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,act,cls='')=>`<button class="${cls}" onclick="${act}">${label}</button>`;
function setNotice(s){notice=s;render();setTimeout(()=>{notice='';render()},3500)}
function call(event,data,cb){socket.emit(event,data,r=>{if(!r?.ok){setNotice(r?.error||'Connection problem. Try again.');return}cb?.(r)})}
function welcome(){app.innerHTML=`<div class="panel center"><div class="hero">Risk it for the grammar biscuit.</div><p class="muted">Play in teams. Bet points. Catch the grammar mistakes.</p><div class="grid" style="max-width:580px;margin:28px auto"><button onclick="createHost()">🖥️ Host a game</button><button class="secondary" onclick="showJoin()">📱 Join a team</button></div></div>`}
function showJoin(){app.innerHTML=`<div class="panel" style="max-width:500px;margin:35px auto"><h2>Join your team</h2><label>6-digit game PIN</label><input id="pin" inputmode="numeric" maxlength="6" placeholder="123456" value="${esc(qs.get('join')||'')}"><p><label>Team name</label><input id="name" maxlength="24" placeholder="The Grammar Sharks"></p><button class="full" onclick="joinTeam()">Join game →</button></div>`}
function createHost(){call('host:create',{},r=>{role='host';code=r.code;token=r.token;sessionStorage.setItem('casinoHost',JSON.stringify({code,token}));render()})}
function joinTeam(){const c=document.getElementById('pin').value.trim(),name=document.getElementById('name').value.trim();call('team:join',{code:c,name},r=>{role='team';code=c;teamId=r.id;teamName=r.name;sessionStorage.setItem('casinoTeam',JSON.stringify({code,id:teamId}));render()})}
function action(a,seconds){call('host:action',{code,action:a,seconds})}
function submitBet(){if(choice===null||bet===null)return setNotice('Choose an answer and a bet.');call('team:bet',{code,id:teamId,choice,bet},()=>{locked=true;render()})}
function choose(v){choice=v;render()};function chooseBet(v){bet=v;render()}
function timerText(){if(!state?.deadline)return state?.roundSeconds===0?'No timer':'—';return Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+'s'}
function teamsHtml(){return `<div class="grid">${[...state.teams].sort((a,b)=>b.score-a.score).map((t,i)=>`<div class="team"><div class="row spread"><b>${i+1}. ${esc(t.name)}</b><span>${state.phase==='question'?(t.submitted?'🔒':'⏳'):''}</span></div><div class="big gold">${t.score}</div>${state.phase==='reveal'?`<div class="${t.delta>0?'status':t.delta<0?'error':'muted'}">${t.delta>0?'+':''}${t.delta} ${t.choice===null?'· no bet':t.choice?'· Correct':'· Incorrect'}</div>`:''}</div>`).join('')}</div>`}
function teacher(){const lobby=state.phase==='lobby',playing=state.phase==='question',reveal=state.phase==='reveal',finished=state.phase==='finished';app.innerHTML=`<div class="teacherLayout"><div><div class="panel">${lobby?`<div class="center"><p class="muted">Scan to join · Game PIN</p><div class="pin gold">${code}</div><img class="qr" src="/api/qr?code=${code}" alt="QR code to join"><p class="muted small">${esc(location.origin+'/?join='+code)}</p><p>${state.teams.length} team(s) joined</p><label>Time per question</label><div class="row" style="justify-content:center;margin:12px 0"><select style="max-width:220px" onchange="action('setTimer',Number(this.value))">${[20,30,45,60,0].map(s=>`<option value="${s}" ${s===state.roundSeconds?'selected':''}>${s?s+' seconds':'No timer'}</option>`).join('')}</select></div>${btn('Start 14 rounds →',"action('start')")}</div>`:finished?`<div class="center"><p class="gold">GAME OVER</p><div class="hero">🏆 ${esc([...state.teams].sort((a,b)=>b.score-a.score)[0]?.name||'Great game!')}</div><p>Final leaderboard below</p>${btn('Play again',"action('reset')")}</div>`:`<div class="row spread"><span class="pill">ROUND ${state.index+1} / ${state.total}</span><span class="pill">${esc(state.question.topic)}</span></div><div class="hero center">${esc(state.question.text)}</div>${playing?`<div class="center"><div class="timer" id="timer">${timerText()}</div><p class="muted">${state.teams.filter(t=>t.submitted).length} of ${state.teams.length} teams have bet</p>${btn('Reveal answer now',"action('reveal')",'secondary')}</div>`:`<div class="answer"><div class="result">${state.answer.correct?'✓ CORRECT':'✕ INCORRECT'}</div>${state.answer.fix?`<p>Correction: <strong>${esc(state.answer.fix)}</strong></p>`:''}</div><p class="center">${btn(state.index===13?'Show final results 🏆':'Next round →',"action('next')")}</p>`}`}</div><div class="panel"><h2>Leaderboard</h2>${teamsHtml()}</div></div><div class="panel center"><h3>Join QR</h3><img class="qr" src="/api/qr?code=${code}" alt="Join QR"><div class="pin" style="font-size:2rem">${code}</div><p class="muted small">Keep this on the projector</p></div></div>`}
function team(){const t=state.teams.find(x=>x.id===teamId);if(!t){app.innerHTML='<div class="panel">Team not found. Reload to join again.</div>';return}const lobby=state.phase==='lobby',playing=state.phase==='question',reveal=state.phase==='reveal',finished=state.phase==='finished';if(playing&&t.submitted)locked=true;app.innerHTML=`<div class="panel"><div class="row spread"><strong>${esc(t.name)}</strong><span class="pill">${state.phase==='lobby'?'Waiting':`Round ${state.index+1}/${state.total}`}</span></div><p class="muted">Your balance</p><div class="big gold">${t.score} points</div></div>${lobby?`<div class="panel center"><h2>You're in! 🎉</h2><p>Discuss each sentence with your team. Choose Correct or Incorrect, then place your bet.</p><p class="muted">Waiting for the teacher to start…</p></div>`:finished?`<div class="panel center"><div class="hero">Game over! 🏆</div><p>Final score: ${t.score}</p></div>`:`<div class="panel"><div class="row spread"><span class="pill">${esc(state.question.topic)}</span><span class="gold" id="timer">${timerText()}</span></div><div class="hero">${esc(state.question.text)}</div>${playing?locked?`<div class="answer center"><h2>🔒 Bet locked!</h2><p>Wait for the teacher to reveal the answer.</p></div>`:`<p class="muted">Is the sentence grammatically correct?</p><div class="row">${btn('✓ Correct',"choose(true)",'choice '+(choice===true?'active':''))}${btn('✕ Incorrect',"choose(false)",'choice '+(choice===false?'active':''))}</div><h3>Place your bet</h3><div class="row">${[50,100,200,300].map(v=>`<button class="bet ${bet===v?'active':'secondary'}" ${v>t.score?'disabled':''} onclick="chooseBet(${v})">${v}</button>`).join('')}</div><p class="muted small">Correct: +your bet · Incorrect: −your bet</p><button class="full" onclick="submitBet()" ${choice===null||bet===null?'disabled':''}>🔒 Lock in bet</button>`:`<div class="answer"><div class="result">${state.answer.correct?'✓ CORRECT':'✕ INCORRECT'}</div>${state.answer.fix?`<p>Correction: ${esc(state.answer.fix)}</p>`:''}<h2 class="${t.delta>0?'status':t.delta<0?'error':'muted'}">${t.delta>0?'+':''}${t.delta} points</h2></div>`}</div>`}<div class="panel"><h3>Leaderboard</h3>${teamsHtml()}</div>`}
function render(){if(!role){if(qs.has('join'))showJoin();else welcome();return}if(!state){app.innerHTML='<div class="panel center">Connecting to game…</div>';return}if(role==='host')teacher();else team();if(notice){const d=document.createElement('div');d.className='panel error';d.textContent=notice;app.prepend(d)}}
socket.on('state',s=>{if(s.code!==code)return;const changed=state&&(s.index!==state.index||s.phase==='question'&&state.phase!=='question');if(changed){choice=null;bet=null;locked=false}state=s;render()});socket.on('notice',setNotice);socket.on('connect',()=>{const h=JSON.parse(sessionStorage.getItem('casinoHost')||'null'),t=JSON.parse(sessionStorage.getItem('casinoTeam')||'null');if(role==='host'||(!role&&h&&!qs.has('join'))){const v=role==='host'?{code,token}:h;socket.emit('host:resume',v,r=>{if(r?.ok){role='host';code=v.code;token=v.token;render()}else{sessionStorage.removeItem('casinoHost');role=null;render()}})}else if(role==='team'||(!role&&t)){const v=role==='team'?{code,id:teamId}:t;socket.emit('team:resume',v,r=>{if(r?.ok){role='team';code=v.code;teamId=v.id;teamName=r.name;render()}else{sessionStorage.removeItem('casinoTeam');role=null;render()}})}else render()});setInterval(()=>{const el=document.getElementById('timer');if(el&&state?.phase==='question')el.textContent=timerText()},250);render();
</script></body></html>
